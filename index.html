<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehabilitacja narządu ruchu ICD-9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: lewy panel = katalog schorzeń z wyszukiwarką; prawy = karta schorzenia z osią faz. Kolory kodują rodzaj procedury: kobalt = kinezyterapia, bursztyn = fizykoterapia, łupek = diagnostyka. */
:root{
  --bg:#f3f5f8;
  --surface:#ffffff;
  --ink:#16202e;
  --muted:#5b6778;
  --line:#dce2ea;
  --accent:#1f4fb8;
  --accent-soft:#e6edfb;
  --amber:#a55c00;
  --amber-soft:#fbf0e1;
  --slate:#4a5a6e;
  --slate-soft:#eaeef3;
  --op:#6a3fa0;
  --op-soft:#f1eafa;
  --warn:#b42318;
  --warn-soft:#fdecea;
  --ok:#1d7a46;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c;--surface:#161d28;--ink:#e6ebf2;--muted:#9aa6b6;--line:#283243;
    --accent:#7fa6ff;--accent-soft:#1a2742;--amber:#f0b25c;--amber-soft:#2e2414;
    --slate:#a9b6c7;--slate-soft:#1f2836;--op:#c3a2ee;--op-soft:#2a2038;
    --warn:#ff8b80;--warn-soft:#3a1c1a;--ok:#5fd394;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c;--surface:#161d28;--ink:#e6ebf2;--muted:#9aa6b6;--line:#283243;
  --accent:#7fa6ff;--accent-soft:#1a2742;--amber:#f0b25c;--amber-soft:#2e2414;
  --slate:#a9b6c7;--slate-soft:#1f2836;--op:#c3a2ee;--op-soft:#2a2038;
  --warn:#ff8b80;--warn-soft:#3a1c1a;--ok:#5fd394;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:330px 1fr;height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.app{grid-template-rows:auto 1fr}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--slate-soft);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
aside{border-right:1px solid var(--line);background:var(--surface);overflow:auto;display:flex;flex-direction:column}
.search{padding:14px 16px 8px;position:sticky;top:0;background:var(--surface);z-index:2;display:grid;gap:8px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.group{padding:6px 0 10px}
.group h3{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 16px 4px;font-weight:600}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 16px 8px 14px;border-left:3px solid transparent;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.item .nm{font-weight:500;display:block;line-height:1.3}
.item .cd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}
main{overflow:auto;padding:24px clamp(16px,3vw,40px) 60px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
.crumb{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,32px);line-height:1.15;margin:2px 0 6px;text-wrap:balance}
.lead{color:var(--muted);max-width:70ch;margin:0}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.code{font-family:var(--mono);font-size:12.5px;border-radius:5px;padding:2px 7px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.code.icd10{border-color:var(--slate);color:var(--slate)}
.code.op{background:var(--op-soft);color:var(--op);border-color:transparent}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fact{background:var(--surface);padding:12px 14px}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);font-weight:600}
.fact .v{font-weight:500;margin-top:2px}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:12px 16px}
.alert h4,.ebm h4,.diagbox h4{margin:0 0 6px;font-family:var(--display);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.alert h4{color:var(--warn)}
.alert ul,.ebm p{margin:0}
.alert ul{padding-left:18px}
.alert li{margin:2px 0}
.ebm{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px}
.ebm h4{color:var(--ok)}
.diagbox{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px}
.diagbox h4{color:var(--slate)}
.diagbox .codes{margin-top:0}
.diagbox .code{background:var(--slate-soft);border-color:transparent;color:var(--ink);white-space:normal}
.diagbox .code b{font-weight:600;color:var(--slate)}
.stepper{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;text-align:left;cursor:pointer;border-right:1px solid var(--line);position:relative}
.step:last-child{border-right:0}
.step:hover{background:var(--bg)}
.step .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:13px}
.step .t{display:block;font-weight:500;font-size:13.5px;line-height:1.25}
.step .tm{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:12px}
.phase-h{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.phase-h .num{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);min-width:2ch}
.phase-h h2{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
.phase-h .tm{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:5px;padding:2px 8px}
.copy{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.phase-b{padding:14px 18px;display:grid;gap:14px}
.goals{margin:0;padding-left:18px;columns:2;column-gap:28px}
.goals li{break-inside:avoid;margin:2px 0}
.lbl{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.lbl.k{color:var(--accent)}.lbl.f{color:var(--amber)}.lbl.g{color:var(--muted)}
.lbl::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.lbl.g::before{display:none}
.proc{width:100%;border-collapse:collapse;font-size:14px}
.proc td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.proc tr:first-child td{border-top:0}
.proc td.c{width:92px;white-space:nowrap}
.proc td.c span{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:2px 6px;border-radius:4px;display:inline-block}
.k-tab td.c span{background:var(--accent-soft);color:var(--accent)}
.f-tab td.c span{background:var(--amber-soft);color:var(--amber)}
.proc td.nm{width:38%;font-weight:500}
.proc td.nt{color:var(--muted)}
.proc .tag{display:inline-block;font-size:11px;font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);margin-right:6px}
.next{border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.next b{font-family:var(--display);font-weight:600;letter-spacing:.03em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend .lk::before{background:var(--accent)}.legend .lf::before{background:var(--amber)}.legend .ld::before{background:var(--slate)}.legend .lo::before{background:var(--op)}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:80ch}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* słownik */
.dict-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dict-tools input{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.dict{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.dict th{text-align:left;font-family:var(--display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.dict td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.dict td.c{font-family:var(--mono);font-weight:600;white-space:nowrap}
.dict tr.sec td{background:var(--bg);font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px;color:var(--muted)}
.uses{display:flex;flex-wrap:wrap;gap:4px}
.uses a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.uses a:hover{text-decoration:underline}
.gk{color:var(--accent)}.gf{color:var(--amber)}.gd{color:var(--slate)}.go{color:var(--op)}
.mobile-pick{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  aside{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  aside .list{display:none}
  .mobile-pick{display:block}
  .mobile-pick select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .cols{grid-template-columns:1fr}
  .goals{columns:1}
  .stepper{flex-direction:column}
  .step{border-right:0;border-bottom:1px solid var(--line)}
  .proc td.nm{width:auto}
  .proc tr{display:grid;grid-template-columns:92px 1fr}
  .proc td.nt{grid-column:2;padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Rehabilitacja narządu ruchu<small>Protokoły kinezyterapii i fizykoterapii z kodami ICD-9 PL</small></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-cat" aria-selected="true">Schorzenia</button>
      <button role="tab" id="tab-dict" aria-selected="false">Słownik ICD-9</button>
    </div>
  </header>
  <aside>
    <div class="search">
      <input id="q" type="search" placeholder="Szukaj: nazwa, ICD-10, ICD-9…" aria-label="Szukaj schorzenia">
      <div class="chips" id="chips"></div>
      <div class="mobile-pick"><select id="pick" aria-label="Wybierz schorzenie"></select></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ===== Stan i renderowanie ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view = 'cat', current = C[0].id, filter = 'all', query = '';
const ROMAN = ['0','I','II','III','IV','V'];

function nameOf(code){ return D[code] ? D[code][0] : '(kod spoza słownika strony)'; }

function matches(c,q){
  if(!q) return true;
  q = q.toLowerCase();
  const hay = [c.name,c.short,c.lead,...c.icd10.flat(),...c.proc,...c.proc.map(nameOf),
    ...c.phases.flatMap(p=>[...p.k,...p.f].flatMap(x=>[x[0],nameOf(x[0])]))].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderChips(){
  const opts = [['all','Wszystkie'],...CATS.map(c=>[c[0],c[1].split(' –')[0].replace('Stan po ','Po ')])];
  $('#chips').innerHTML = opts.map(o=>`<button class="chip" data-f="${o[0]}" aria-pressed="${filter===o[0]}">${esc(o[1])}</button>`).join('');
}

function renderList(){
  const html = CATS.filter(cat=>filter==='all'||filter===cat[0]).map(cat=>{
    const items = C.filter(c=>c.cat===cat[0]&&matches(c,query));
    if(!items.length) return '';
    return `<div class="group"><h3>${esc(cat[1])}</h3>${items.map(c=>`<button class="item" data-id="${c.id}" aria-current="${c.id===current&&view==='cat'}"><span class="nm">${esc(c.name)}</span><span class="cd">${esc(c.icd10.map(x=>x[0]).join(' · '))}${c.proc.length?' · '+esc(c.proc.join(', ')):''}</span></button>`).join('')}</div>`;
  }).join('');
  $('#list').innerHTML = html || '<div class="empty">Brak wyników. Spróbuj kodu (np. M17, 81.54, 93.3930) albo innej nazwy.</div>';
  $('#pick').innerHTML = C.filter(c=>(filter==='all'||filter===c.cat)&&matches(c,query)).map(c=>`<option value="${c.id}" ${c.id===current?'selected':''}>${esc(c.name)}</option>`).join('');
}

function procTable(rows,cls){
  if(!rows.length) return '';
  return `<table class="proc ${cls}-tab"><tbody>${rows.map(([code,note])=>{
    const sub = D[code] && D[code][2] && cls==='f' ? `<span class="tag">${esc(D[code][2])}</span>` : '';
    return `<tr><td class="c"><span>${esc(code)}</span></td><td class="nm">${sub}${esc(nameOf(code))}</td><td class="nt">${esc(note||'')}</td></tr>`;}).join('')}</tbody></table>`;
}

function renderCondition(){
  const c = C.find(x=>x.id===current) || C[0];
  const cat = CATS.find(x=>x[0]===c.cat)[1];
  const startIdx = c.phases[0].time.includes('przed') ? 0 : 1;
  const num = i => ROMAN[i+startIdx];
  $('#main').innerHTML = `<div class="wrap">
    <div>
      <div class="crumb">${esc(cat)}</div>
      <h1>${esc(c.name)}</h1>
      <p class="lead">${esc(c.lead)}</p>
      <div class="codes">
        ${c.icd10.map(x=>`<span class="code icd10" title="ICD-10">${esc(x[0])} · ${esc(x[1])}</span>`).join('')}
        ${c.proc.map(x=>`<span class="code op" title="ICD-9 PL – zabieg">${esc(x)} · ${esc(nameOf(x))}</span>`).join('')}
      </div>
    </div>
    <div class="facts">${c.facts.map(f=>`<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])}</div></div>`).join('')}</div>
    <div class="cols">
      <div class="alert"><h4>Ostrzeżenia i przeciwwskazania</h4><ul>${c.alerts.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="ebm"><h4>Dowody naukowe</h4><p>${esc(c.ebm)}</p></div>
    </div>
    <div class="diagbox"><h4>Diagnostyka fizjoterapeutyczna (każda faza)</h4>
      <div class="codes">${c.diag.map(d=>`<span class="code"><b>${esc(d)}</b> ${esc(nameOf(d))}</span>`).join('')}</div>
    </div>
    <div class="legend"><span class="lk">Kinezyterapia</span><span class="lf">Fizykoterapia i masaż</span><span class="ld">Diagnostyka</span><span class="lo">Zabieg operacyjny</span></div>
    <nav class="stepper" aria-label="Fazy rehabilitacji">${c.phases.map((p,i)=>`<button class="step" data-go="ph-${i}"><span class="n">Faza ${num(i)}</span><span class="t">${esc(p.name)}</span><span class="tm">${esc(p.time)}</span></button>`).join('')}</nav>
    ${c.phases.map((p,i)=>`<section class="phase" id="ph-${i}">
      <div class="phase-h"><span class="num">${num(i)}</span><h2>${esc(p.name)}</h2><span class="tm">${esc(p.time)}</span>
        <button class="copy" data-copy="${i}">Kopiuj kody fazy</button></div>
      <div class="phase-b">
        <div><p class="lbl g">Cele</p><ul class="goals">${p.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>
        <div><p class="lbl k">Kinezyterapia</p>${procTable(p.k,'k')}</div>
        ${p.f.length?`<div><p class="lbl f">Fizykoterapia i masaż</p>${procTable(p.f,'f')}</div>`:''}
        <div class="next"><b>Kryterium przejścia:</b> ${esc(p.next)}</div>
      </div></section>`).join('')}
    <p class="foot">Materiał poglądowy dla fizjoterapeutów i lekarzy. Obciążanie, zakresy ruchu i terminy zawsze ustala lekarz prowadzący lub operator; protokół trzeba dostosować do pacjenta. Nazwy procedur wg słownika ICD-9 PL (wersja obowiązująca od 01.01.2025); przed sprawozdawaniem świadczeń sprawdź kod w aktualnej wersji słownika NFZ.</p>
  </div>`;
  $('#main').scrollTop = 0;
}

function renderDict(){
  const used = {};
  C.forEach(c=>{
    const add=code=>{(used[code]=used[code]||new Set()).add(c.id)};
    c.proc.forEach(add); c.diag.forEach(add);
    c.phases.forEach(p=>[...p.k,...p.f].forEach(x=>add(x[0])));
  });
  const codes = Object.keys(D);
  const order = ['d','k','f','o'];
  const dq = (window._dq||'').toLowerCase();
  let rows = '';
  order.forEach(g=>{
    const list = codes.filter(k=>D[k][1]===g && (!dq || (k+' '+D[k][0]+' '+(D[k][2]||'')).toLowerCase().includes(dq)));
    if(!list.length) return;
    rows += `<tr class="sec"><td colspan="4"><span class="g${g}">■</span> ${esc(G[g])}</td></tr>`;
    list.forEach(k=>{
      const u = [...(used[k]||[])].map(id=>C.find(c=>c.id===id));
      rows += `<tr><td class="c g${g}">${esc(k)}</td><td>${esc(D[k][0])}</td><td>${esc(D[k][2]||'')}</td><td><div class="uses">${u.map(c=>`<a href="#${c.id}">${esc(c.name.replace(/ –.*/,''))}</a>`).join('')||'<span style="color:var(--muted)">–</span>'}</div></td></tr>`;
    });
  });
  $('#main').innerHTML = `<div class="wrap">
    <div><div class="crumb">Słownik</div><h1>Kody ICD-9 PL użyte w protokołach</h1>
    <p class="lead">${codes.length} procedur z rozdziałów 93.0–93.3 (fizjoterapia), 79 (nastawienie złamań) i 81 (endoprotezoplastyka). Kliknij schorzenie, aby otworzyć jego protokół.</p></div>
    <div class="dict-tools"><input id="dq" type="search" placeholder="Szukaj kodu lub nazwy, np. 93.39, laser, TENS" value="${esc(window._dq||'')}" aria-label="Szukaj w słowniku"></div>
    <div style="overflow-x:auto"><table class="dict"><thead><tr><th>Kod</th><th>Nazwa procedury</th><th>Grupa</th><th>Stosowany w</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Brak wyników.</td></tr>'}</tbody></table></div>
    <p class="foot">Źródło nazw: Międzynarodowa Klasyfikacja Procedur Medycznych ICD-9 PL (wersja danych z 11.01.2025). Pisownia nazw 93.27 i 93.28 zgodna ze słownikiem.</p>
  </div>`;
  const inp = $('#dq');
  inp.addEventListener('input',e=>{window._dq=e.target.value;const pos=e.target.selectionStart;renderDict();const n=$('#dq');n.focus();n.setSelectionRange(pos,pos);});
}

function render(){
  $('#tab-cat').setAttribute('aria-selected',view==='cat');
  $('#tab-dict').setAttribute('aria-selected',view==='dict');
  renderChips(); renderList();
  view==='cat' ? renderCondition() : renderDict();
}

function fromHash(){
  const h = location.hash.slice(1);
  if(h==='slownik'){view='dict';}
  else if(C.some(c=>c.id===h)){view='cat';current=h;}
  render();
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800);}

document.addEventListener('click',e=>{
  const it = e.target.closest('.item'); if(it){location.hash=it.dataset.id;return;}
  const ch = e.target.closest('.chip'); if(ch){filter=ch.dataset.f;renderChips();renderList();return;}
  const st = e.target.closest('.step'); if(st){document.getElementById(st.dataset.go).scrollIntoView({behavior:'smooth',block:'start'});return;}
  const cp = e.target.closest('.copy');
  if(cp){
    const c = C.find(x=>x.id===current), p = c.phases[+cp.dataset.copy];
    const txt = `${c.name} – faza: ${p.name} (${p.time})\n`+[...p.k,...p.f].map(([k,n])=>`${k}\t${nameOf(k)}${n?' – '+n:''}`).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Skopiowano kody fazy')).catch(()=>toast('Schowek niedostępny w tym widoku'));
  }
});
$('#tab-cat').onclick=()=>{location.hash=current;};
$('#tab-dict').onclick=()=>{location.hash='slownik';};
$('#q').addEventListener('input',e=>{query=e.target.value.trim();renderList();});
$('#pick').addEventListener('change',e=>{location.hash=e.target.value;});
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
